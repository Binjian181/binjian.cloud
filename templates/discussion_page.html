{% extends "base.html" %}

{% block extra_css %}
<style>
    .discussion-container {
        max-width: 800px;
        margin: 0 auto;
    }
    
    .coming-soon {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 60px 20px;
        text-align: center;
        color: var(--muted-text);
        box-shadow: 0 2px 12px var(--shadow-color);
    }
    
    .coming-soon-icon {
        font-size: 64px;
        margin-bottom: 20px;
        opacity: 0.5;
    }
    
    .coming-soon-title {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 12px;
        color: var(--text-color);
    }
    
    .coming-soon-desc {
        font-size: 16px;
        line-height: 1.8;
    }
</style>
{% endblock %}

{% block content %}
<main class="main-content">
    <header class="page-header">
        <h1>💬 讨论区</h1>
        <div class="update-time">最后更新：{{ update_time }}</div>
    </header>

    <div class="discussion-container">
        <div class="coming-soon">
            <div class="coming-soon-icon">🚧</div>
            <h2 class="coming-soon-title">功能开发中</h2>
            <p class="coming-soon-desc">
                讨论区功能正在开发中，敬请期待~<br>
                后续将支持评论、留言、互动等功能
            </p>
        </div>
    </div>
</main>
{% endblock %}
