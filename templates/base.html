<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page_description | default('Binjian - 高效办公、轻松生活、终身学习') }}">
    <meta property="og:title" content="{{ page_title }}">
    <meta property="og:description" content="{{ page_description | default('Binjian - 高效办公、轻松生活、终身学习') }}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_CN">
    <link rel="canonical" href="https://binjian.cloud{{ canonical_path | default('') }}">
    <title>{{ page_title }}</title>
    <link rel="icon" href="/icons.png" type="image/png">
    <link rel="stylesheet" href="/css/common.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- 移动端顶部栏 -->
    <div class="top-bar" id="topBar">
        <button class="menu-toggle" id="menuToggle" title="显示菜单" aria-label="打开导航菜单" aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <span class="page-title" id="pageTitle">{{ page_title }}</span>
        <button class="theme-toggle-mobile" id="themeToggleMobile" title="切换主题" aria-label="切换主题" aria-pressed="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
    </div>

    <div class="container">
        <!-- 统一导航栏 -->
        <div class="nav-sidebar" id="navSidebar">
            <nav class="nav-bar" aria-label="主导航">
                <a href="/" class="nav-btn{% if page_type == 'home' %} active{% endif %}">🏠 返回主页</a>
                <a href="/people-news.html" class="nav-btn{% if page_type == 'people' %} active{% endif %}">🇨🇳 时政观点</a>
                <a href="/tech-news.html" class="nav-btn{% if page_type == 'tech' %} active{% endif %}">📱 科技资讯</a>
                <a href="/daily.html" class="nav-btn{% if page_type == 'daily' %} active{% endif %}">📖 时评精读</a>
                <a href="/articles.html" class="nav-btn{% if page_type == 'articles' %} active{% endif %}">📝 原创文章</a>
                <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换主题" aria-pressed="false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <span class="theme-text">主题</span>
                </button>
            </nav>
        </div>

        {% block content %}{% endblock %}
    </div>

    <script src="/js/common.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
