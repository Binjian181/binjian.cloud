        <link rel="stylesheet" href="/css/common.css">
    <style>
        /* 主页特有样式 */
        :root {
            --accent-color: #ff8c00;
            --accent-gradient: linear-gradient(135deg, #ff8c00 0%, #ff6b00 100%);
        }
        
        /* 主页容器 - 三栏布局 */
        .home-container {
            flex: 1;
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 200px 1fr 300px;
            gap: 24px;
        }
        
        /* 左侧边栏 */
        .sidebar-left {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 16px 0;
            border: 1px solid var(--border-color);
        }
        
        .sidebar-menu {
            list-style: none;
        }
        
        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            text-decoration: none;
            color: var(--secondary-text);
            font-size: 15px;
            transition: all 0.2s;
        }
        
        .sidebar-menu li a:hover,
        .sidebar-menu li a.active {
            background-color: var(--bg-color);
            color: var(--accent-color);
        }
        
        .sidebar-menu li a svg {
            width: 18px;
            height: 18px;
        }

        /* 桌面端主题切换按钮 */
        .theme-toggle-desktop {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--secondary-text);
            padding: 12px 20px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            width: 100%;
        }

        .theme-toggle-desktop:hover {
            background-color: var(--bg-color);
            color: var(--accent-color);
        }

        .theme-toggle-desktop svg {
            width: 18px;
            height: 18px;
        }
        
        /* 中间内容区 */
        .content-main {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        /* 轮播图 */
        .banner {
            background: var(--accent-gradient);
            border-radius: 8px;
            height: 320px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            color: #fff;
            margin-bottom: 8px;
        }
        
        .banner-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        
        .banner-desc {
            font-size: 16px;
            opacity: 0.95;
        }
        
        /* 文章卡片 */
        .article-card {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 24px;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .article-card:hover {
            box-shadow: 0 8px 24px var(--shadow-color);
            transform: translateY(-2px);
        }
        
        .article-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 12px;
            line-height: 1.5;
        }
        
        .article-summary {
            font-size: 15px;
            color: var(--secondary-text);
            margin-bottom: 16px;
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .article-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            color: var(--muted-text);
        }
        
        .author {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--accent-color);
        }
        
        .tag {
            background-color: var(--bg-color);
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        
        /* 右侧边栏 */
        .sidebar-right {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .widget {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 20px;
        }
        
        .widget-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-color);
        }
        
        .profile-card {
            text-align: center;
        }
        
        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent-gradient);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            overflow: hidden;
        }
        
        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        
        .profile-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .profile-bio {
            font-size: 14px;
            color: var(--secondary-text);
            margin-bottom: 16px;
        }
        
        /* 快速入口卡片 */
        .quick-entry {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .quick-card {
            border-radius: 12px;
            padding: 24px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }
        
        .quick-card:hover {
            transform: translateY(-2px);
        }
        
        .quick-card-red {
            background: linear-gradient(135deg, #c8102e 0%, #8b0000 100%);
            box-shadow: 0 2px 12px rgba(200, 16, 46, 0.2);
        }
        
        .quick-card-red:hover {
            box-shadow: 0 8px 24px rgba(200, 16, 46, 0.3);
        }
        
        .quick-card-purple {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 2px 12px rgba(102, 126, 234, 0.2);
        }
        
        .quick-card-purple:hover {
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        }
        
        .quick-card-green {
            background: linear-gradient(135deg, #16a34a 0%, #047857 100%);
            box-shadow: 0 2px 12px rgba(22, 163, 74, 0.2);
        }
        
        .quick-card-green:hover {
            box-shadow: 0 8px 24px rgba(22, 163, 74, 0.3);
        }
        
        .quick-card-pink {
            background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
            box-shadow: 0 2px 12px rgba(236, 72, 153, 0.2);
        }
        
        .quick-card-pink:hover {
            box-shadow: 0 8px 24px rgba(236, 72, 153, 0.3);
        }
        
        .quick-card-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .quick-card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .quick-card-desc {
            font-size: 14px;
            opacity: 0.9;
        }
        
        /* 响应式设计 */
        @media (max-width: 1024px) {
            .home-container {
                grid-template-columns: 1fr 300px;
            }
            .sidebar-left {
                display: none;
            }
        }
        
        @media (max-width: 768px) {
            .home-container {
                grid-template-columns: 1fr;
            }
            .sidebar-right {
                display: none;
            }
            .banner {
                height: 240px;
                padding: 24px;
            }
            .banner-title {
                font-size: 22px;
            }
            .quick-entry {
                grid-template-columns: 1fr;
            }
            .sidebar-left.open {
                display: block;
                position: fixed;
                top: 60px;
                left: 0;
                right: 0;
                bottom: 0;
                background: var(--bg-color);
                padding: 20px;
                z-index: 99;
                overflow-y: auto;
            }
        }
    </style>
