name: 抓取资讯并更新站点

on:
  schedule:
    # 每 3 小时一次，与原服务器上的 crontab 一致
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 抓取、生成页面并发布
        run: bash scripts/actions_pipeline.sh fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
