name: 人民时评精读

on:
  schedule:
    # 北京时间 07:00 与 09:30，各跑一次；脚本会自动跳过已处理过的文章
    - cron: '0 23 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-pipeline
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 生成当日精读并发布
        run: bash scripts/actions_pipeline.sh daily
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
